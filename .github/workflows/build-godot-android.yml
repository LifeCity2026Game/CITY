name: Build LIFE CITY Godot Android APK
# CI build trigger refresh after vehicle smoke-test correction.

on:
  push:
    branches: ["main", "godot-migration"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: lifecity-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Android export requirements
        run: |
          apt-get update
          apt-get install -y openjdk-17-jdk-headless wget unzip fontconfig libfontconfig1
          export_templates_dir="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$export_templates_dir" /tmp/godot-templates
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O /tmp/godot-templates/export_templates.tpz
          unzip -q /tmp/godot-templates/export_templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$export_templates_dir/"
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"

      - name: Create Firebase client configuration
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_WEB_API_KEY}" ]; then
            echo "FIREBASE_WEB_API_KEY repository secret is missing."
            exit 1
          fi
          cat > firebase_config.cfg <<EOF
          [firebase]
          api_key="${FIREBASE_WEB_API_KEY}"
          project_id="life-city-test"
          database_url="https://life-city-test-default-rtdb.firebaseio.com/"
          EOF

      - name: Check Godot project
        shell: bash
        run: |
          set -o pipefail
          godot --version
          godot --headless --path . --editor --quit 2>&1 | tee godot-check.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" godot-check.log; then
            echo "Godot reported script or project errors."
            exit 1
          fi

      - name: Run headless game smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 10 2>&1 | tee godot-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" godot-runtime.log; then
            echo "The game scene reported runtime or script errors."
            exit 1
          fi

      - name: Test city building exteriors, interiors and entry/exit
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/city_interiors_smoke_test.gd 2>&1 | tee city-interiors-test.log
          if ! grep -q "CITY_INTERIORS_SMOKE_TEST_PASS" city-interiors-test.log; then
            echo "City building interior smoke test did not pass."
            exit 1
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" city-interiors-test.log; then
            echo "City interior test reported script or runtime errors."
            exit 1
          fi

      - name: Test military command, aircraft strikes and city hall
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/military_smoke_test.gd 2>&1 | tee military-test.log
          if ! grep -q "MILITARY_SMOKE_TEST_PASS" military-test.log; then
            echo "Military command smoke test did not pass."
            exit 1
          fi

      - name: Test vehicle entry, acceleration and exit
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/vehicle_smoke_test.gd 2>&1 | tee vehicle-test.log
          if ! grep -q "VEHICLE_SMOKE_TEST_PASS" vehicle-test.log; then
            echo "Vehicle interaction smoke test did not pass."
            exit 1
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" vehicle-test.log; then
            echo "Vehicle test reported script or runtime errors."
            exit 1
          fi

      - name: Test two-player ENet connection and movement sync
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/network_smoke_test.gd -- server > network-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if grep -q "NETWORK_TEST_SERVER_READY" network-server.log; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat network-server.log; exit 1; fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then cat network-server.log; echo "ENet host did not become ready."; exit 1; fi
          timeout 20s godot --headless --path . --script res://tests/network_smoke_test.gd -- client 2>&1 | tee network-client.log
          wait "$server_pid"
          cat network-server.log
          grep -q "NETWORK_SMOKE_TEST_CLIENT_PASS" network-client.log
          grep -q "NETWORK_SMOKE_TEST_SERVER_PASS" network-server.log

      - name: Test banking, cheques, prison and Central Bank
        timeout-minutes: 2
        shell: bash
        run: |
          set -o pipefail
          timeout 45s godot --headless --path . --script res://tests/finance_smoke_test.gd 2>&1 | tee finance-test.log
          if ! grep -q "FINANCE_SMOKE_TEST_PASS" finance-test.log; then
            echo "Finance and prison smoke test did not pass."
            exit 1
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" finance-test.log; then
            echo "Finance test reported script or runtime errors."
            exit 1
          fi

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/LIFE_CITY.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFE-CITY-Android-APK
          path: build/LIFE_CITY.apk
          if-no-files-found: error
          retention-days: 14
