name: Build LIFE CITY Godot Android APK

on:
  push:
    branches: ["godot-migration"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Godot project
        run: |
          godot --version
          godot --headless --path . --editor --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/LIFE_CITY.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFE-CITY-Android-APK
          path: build/LIFE_CITY.apk
          if-no-files-found: error
          retention-days: 14
