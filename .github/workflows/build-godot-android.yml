name: Build LIFE CITY Godot Android APK
# CI build trigger refresh after vehicle smoke-test correction.
# Vehicle add-ons are verified before Android export.

on:
  push:
    branches: ["main", "godot-migration"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: lifecity-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ProtonScatter editor addon
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/HungryProton/scatter.git /tmp/proton-scatter
          git -C /tmp/proton-scatter checkout 7198cc00078ebde61307578137c3f35223c6e438
          mkdir -p addons/proton_scatter
          cp -a /tmp/proton-scatter/addons/proton_scatter/. addons/proton_scatter/
          # Godot 4.7 headless import cannot process the addon's optional Blender demo source.
          find addons/proton_scatter -type f -name '*.blend' -delete
          test -f addons/proton_scatter/plugin.cfg
          test -f addons/proton_scatter/plugin.gd
          test -f addons/proton_scatter/LICENSE
          grep -q 'version="4.2.0"' addons/proton_scatter/plugin.cfg
          echo "PROTON_SCATTER_SOURCE_VERIFIED"

      - name: Install Android export requirements
        run: |
          apt-get update
          apt-get install -y openjdk-17-jdk-headless wget unzip fontconfig libfontconfig1
          export_templates_dir="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$export_templates_dir" /tmp/godot-templates
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O /tmp/godot-templates/export_templates.tpz
          unzip -q /tmp/godot-templates/export_templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$export_templates_dir/"
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"

      - name: Create Firebase client configuration
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_WEB_API_KEY}" ]; then
            echo "FIREBASE_WEB_API_KEY repository secret is missing."
            exit 1
          fi
          cat > firebase_config.cfg <<EOF
          [firebase]
          api_key="${FIREBASE_WEB_API_KEY}"
          project_id="life-city-test"
          database_url="https://life-city-test-default-rtdb.firebaseio.com/"
          EOF

      - name: Check Godot project
        shell: bash
        run: |
          set -o pipefail
          godot --version
          godot --headless --path . --editor --import --quit 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" godot-import.log; then
            echo "Godot reported resource import errors."
            exit 1
          fi
          godot --headless --path . --editor --quit 2>&1 | tee godot-check.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" godot-check.log; then
            echo "Godot reported script or project errors."
            exit 1
          fi

      - name: Run headless game smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 10 2>&1 | tee godot-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" godot-runtime.log; then
            echo "The game scene reported runtime or script errors."
            exit 1
          fi

      - name: Test adaptive graphics profiles and FPS scaling
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/graphics_settings_smoke_test.gd 2>&1 | tee graphics-settings-test.log
          if ! grep -q "GRAPHICS_SETTINGS_SMOKE_TEST_PASS" graphics-settings-test.log; then
            echo "Adaptive graphics smoke test did not pass."
            exit 1
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" graphics-settings-test.log; then
            echo "Graphics settings test reported script or runtime errors."
            exit 1
          fi

      - name: Test city building exteriors, interiors and entry/exit
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/city_interiors_smoke_test.gd 2>&1 | tee city-interiors-test.log
          if ! grep -q "CITY_INTERIORS_SMOKE_TEST_PASS" city-interiors-test.log; then
            echo "City building interior smoke test did not pass."
            exit 1
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" city-interiors-test.log; then
            echo "City interior test reported script or runtime errors."
            exit 1
          fi

      - name: Test military command, aircraft strikes and city hall
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/military_smoke_test.gd 2>&1 | tee military-test.log
          if ! grep -q "MILITARY_SMOKE_TEST_PASS" military-test.log; then
            echo "Military command smoke test did not pass."
            exit 1
          fi

      - name: Test five military editor add-ons and registries
        timeout-minutes: 2
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/military_addons_smoke_test.gd 2>&1 | tee military-addons-test.log
          if ! grep -q "MILITARY_ADDONS_SMOKE_TEST_PASS" military-addons-test.log; then
            echo "Military add-on smoke test did not pass."
            exit 1
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" military-addons-test.log; then
            echo "Military add-on test reported errors."
            exit 1
          fi

      - name: Test vehicle entry, acceleration and exit
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/vehicle_smoke_test.gd 2>&1 | tee vehicle-test.log
          if ! grep -q "VEHICLE_SMOKE_TEST_PASS" vehicle-test.log; then
            echo "Vehicle interaction smoke test did not pass."
            exit 1
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" vehicle-test.log; then
            echo "Vehicle test reported script or runtime errors."
            exit 1
          fi

      - name: Test all nine distinct vehicle catalog profiles
        timeout-minutes: 2
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/vehicle_catalog_profiles_test.gd 2>&1 | tee vehicle-catalog-test.log
          if ! grep -q "VEHICLE_CATALOG_TEST_PASS" vehicle-catalog-test.log; then
            echo "Nine-model vehicle catalog profile test did not pass."
            exit 1
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" vehicle-catalog-test.log; then
            echo "Vehicle catalog test reported script or runtime errors."
            exit 1
          fi

      - name: Test all imported GLB vehicle assets, rigs, collision and controller integration
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/vehicle_asset_integration_test.gd 2>&1 | tee vehicle-assets-test.log
          if ! grep -q "VEHICLE_ASSET_INTEGRATION_TEST_PASS" vehicle-assets-test.log; then
            echo "Imported vehicle asset integration test did not pass."
            exit 1
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" vehicle-assets-test.log; then
            echo "Vehicle asset integration test reported errors."
            exit 1
          fi

      - name: Test five vehicle editor add-ons
        timeout-minutes: 2
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/vehicle_addons_smoke_test.gd 2>&1 | tee vehicle-addons-test.log
          if ! grep -q "VEHICLE_ADDONS_SMOKE_TEST_PASS" vehicle-addons-test.log; then
            echo "Vehicle add-on smoke test did not pass."
            exit 1
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" vehicle-addons-test.log; then
            echo "Vehicle add-on test reported errors."
            exit 1
          fi

      - name: Test two-player ENet connection and movement sync
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/network_smoke_test.gd -- server > network-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if grep -q "NETWORK_TEST_SERVER_READY" network-server.log; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat network-server.log; exit 1; fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then cat network-server.log; echo "ENet host did not become ready."; exit 1; fi
          timeout 20s godot --headless --path . --script res://tests/network_smoke_test.gd -- client 2>&1 | tee network-client.log
          wait "$server_pid"
          cat network-server.log
          grep -q "NETWORK_SMOKE_TEST_CLIENT_PASS" network-client.log
          grep -q "NETWORK_SMOKE_TEST_SERVER_PASS" network-server.log

      - name: Test banking, cheques, prison and Central Bank
        timeout-minutes: 2
        shell: bash
        run: |
          set -o pipefail
          timeout 45s godot --headless --path . --script res://tests/finance_smoke_test.gd 2>&1 | tee finance-test.log
          if ! grep -q "FINANCE_SMOKE_TEST_PASS" finance-test.log; then
            echo "Finance and prison smoke test did not pass."
            exit 1
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" finance-test.log; then
            echo "Finance test reported script or runtime errors."
            exit 1
          fi

      - name: Test online store catalog, checkout, inventory and delivery
        timeout-minutes: 2
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/online_store_smoke_test.gd 2>&1 | tee online-store-test.log
          if ! grep -q "ONLINE_STORE_SMOKE_TEST_PASS" online-store-test.log; then
            echo "Online store smoke test did not pass."
            exit 1
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" online-store-test.log; then
            echo "Online store test reported script or runtime errors."
            exit 1
          fi

      - name: Test responsive touch-friendly UI addon
        timeout-minutes: 2
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/ui_system_smoke_test.gd 2>&1 | tee ui-system-test.log
          if ! grep -q "LIFE_CITY_UI_SMOKE_TEST_PASS" ui-system-test.log; then
            echo "Responsive UI smoke test did not pass."
            exit 1
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" ui-system-test.log; then
            echo "UI system test reported script or runtime errors."
            exit 1
          fi

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/LIFE_CITY.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFE-CITY-Android-APK
          path: build/LIFE_CITY.apk
          if-no-files-found: error
          retention-days: 14
