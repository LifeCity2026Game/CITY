name: Import free CC0 vehicle models

on:
  workflow_dispatch:
  push:
    branches:
      - godot-migration
    paths:
      - ".github/import-free-vehicles"

permissions:
  contents: write

concurrency:
  group: free-vehicle-import
  cancel-in-progress: false

jobs:
  import-vehicles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LIFE CITY
        uses: actions/checkout@v4
        with:
          ref: godot-migration
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install downloader dependency
        run: python -m pip install requests
      - name: Download and validate CC0 GLB models
        run: python tools/import_free_vehicles.py
      - name: Install glTF Transform CLI
        run: npm install --global @gltf-transform/cli
      - name: Dequantize GLB geometry for Godot compatibility
        shell: bash
        run: |
          set -euo pipefail
          for model in assets/vehicles/*/*.glb; do
            converted="${model%.glb}.godot.glb"
            gltf-transform dequantize "$model" "$converted"
            mv "$converted" "$model"
          done
      - name: Verify Godot-compatible GLBs, rigs and animations
        run: python tools/verify_vehicle_glbs_godot.py
      - name: Commit vehicle models into LIFE CITY
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vehicles
          if git diff --cached --quiet; then
            echo "No vehicle asset changes to commit."
          else
            git commit -m "Import free CC0 vehicle models for LIFE CITY"
            git fetch origin godot-migration
            git rebase origin/godot-migration
            git push origin HEAD:godot-migration
          fi
