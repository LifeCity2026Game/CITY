name: MPFB Human Creator and Asset Library Check

on:
  workflow_dispatch:
  push:
    branches: ["godot-migration"]
    paths:
      - ".github/workflows/mpfb-check.yml"
      - "tools/blender/check_mpfb.py"
      - "assets/characters/mpfb/README.md"

permissions:
  contents: read

jobs:
  mpfb:
    name: Install MPFB and verify free CC0 character assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LIFE CITY
        uses: actions/checkout@v4

      - name: Download official Blender 4.5.16
        shell: bash
        run: |
          set -euo pipefail
          base="https://download.blender.org/release/Blender4.5"
          archive="blender-4.5.16-linux-x64.tar.xz"
          curl -fL "$base/$archive" -o "/tmp/$archive"
          curl -fL "$base/blender-4.5.16.sha256" -o /tmp/blender.sha256
          expected="$(grep "$archive" /tmp/blender.sha256 | awk '{print $1}')"
          echo "$expected  /tmp/$archive" | sha256sum --check -
          mkdir -p "$HOME/blender"
          tar -xJf "/tmp/$archive" -C "$HOME/blender" --strip-components=1
          echo "$HOME/blender" >> "$GITHUB_PATH"

      - name: Install free MPFB human generator
        shell: bash
        run: |
          set -euo pipefail
          blender --version
          blender --online-mode --command extension install --sync --enable mpfb

      - name: Download official CC0 MPFB asset packs
        shell: bash
        run: |
          set -euo pipefail
          base="https://files2.makehumancommunity.org/asset_packs"
          mkdir -p "$RUNNER_TEMP/mpfb-packs"
          declare -A packs=(
            ["makehuman_system_assets"]="makehuman_system_assets/makehuman_system_assets_cc0.zip"
            ["skins01"]="skins01/skins01_cc0.zip"
            ["skins02"]="skins02/skins02_cc0.zip"
            ["shirts01"]="shirts01/shirts01_cc0.zip"
            ["pants01"]="pants01/pants01_cc0.zip"
            ["shoes01"]="shoes01/shoes01_cc0.zip"
            ["hats01"]="hats01/hats01_cc0.zip"
            ["poses01"]="poses01/poses01_cc0.zip"
          )
          for pack in "${!packs[@]}"; do
            echo "Downloading CC0 pack: $pack"
            curl --fail --location --retry 3 --retry-delay 2 \
              "$base/${packs[$pack]}" \
              -o "$RUNNER_TEMP/mpfb-packs/$pack.zip"
            unzip -tq "$RUNNER_TEMP/mpfb-packs/$pack.zip"
          done

      - name: Install packs into MPFB library and verify asset categories
        id: verify_assets
        shell: bash
        run: |
          set -euo pipefail
          blender --background --python tools/blender/check_mpfb.py -- "$RUNNER_TEMP/mpfb-packs"

      - name: Upload reusable MPFB asset library
        uses: actions/upload-artifact@v4
        with:
          name: lifecity-mpfb-cc0-asset-library
          path: ${{ steps.verify_assets.outputs.asset_data_dir }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
